predict_dataset:
  shuffle: False
  batch_size: 1
  # Predict is cloud-by-cloud; fewer workers avoid host-RAM contention.
  num_workers: 2
  datapath:
    input_dataset_dir: ./dataset_test_noisy
    use_prob: False
    loader: npy
    data_name: noisy.npy
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist/test.txt, 1.0],
      ]
